# PRUEBA DE DESACOPLAMIENTO: misma app, otro motor de base de datos.
# Solo cambian variables de entorno; no se toca ni una linea de services/ ni controllers/.
# Uso: docker compose -f docker-compose.yml -f docker-compose.mysql.yml up --build
services:
  app:
    environment:
      DB_DIALECT: mysql
      DB_HOST: mysql
      DB_PORT: 3306

  mysql:
    image: mysql:8.4
    container_name: biblioteca-mysql
    environment:
      MYSQL_DATABASE: biblioteca_db
      MYSQL_USER: biblioteca
      MYSQL_PASSWORD: biblioteca
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
